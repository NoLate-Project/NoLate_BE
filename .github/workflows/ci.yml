name: NoLate BE CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: be-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus alert rules
        env:
          PROMETHEUS_IMAGE: "prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996"
        run: |
          # Pin the v3.5.0 manifest digest so a mutable image tag cannot change CI behavior.
          docker run --rm --entrypoint /bin/promtool \
            --volume "${GITHUB_WORKSPACE}/ops/prometheus:/work:ro" \
            "${PROMETHEUS_IMAGE}" \
            check rules /work/nolate-release-alerts.yml
          docker run --rm --entrypoint /bin/promtool \
            --volume "${GITHUB_WORKSPACE}/ops/prometheus:/work:ro" \
            "${PROMETHEUS_IMAGE}" \
            test rules /work/nolate-release-alerts.test.yml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon clean test bootWar
      - name: Verify WAR contains no credential files
        run: |
          WAR_FILE="$(find build/libs -name '*.war' ! -name '*plain*' | head -n 1)"
          if jar tf "$WAR_FILE" | grep -Eiq '(^|/)(env\.properties|.*firebase-admin.*\.json|.*service-account.*\.json|.*serviceAccount.*\.json)$'; then
            echo "Credential-like file found in packaged WAR."
            exit 1
          fi
      - run: docker build --tag nolate-be-ci:${{ github.sha }} .
