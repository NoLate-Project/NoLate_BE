spring:
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      # 운영 DDL은 maintenance window의 검토된 SQL만 수행한다. update를 허용하면
      # old/new writer 사이에서 nullable/index 변경 순서가 뒤섞일 수 있다.
      ddl-auto: validate
    open-in-view: false

logging:
  level:
    # JDBC driver duplicate-key 원문은 opaque credential을 포함할 수 있다. 운영에서는
    # P6Spy의 operation/table/SQLState/vendorCode/exceptionClass 기반 metadata만 남기며
    # SQL 원문, sqlWithValues, SQLException message/stack trace는 기록하지 않는다.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

# 운영 API 계약과 내부 모델을 공개하지 않는다. 개발/테스트 프로필의 Swagger는 유지한다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

schedule:
  push:
    # 최초 migration 기동은 false로 두어 guard/backfill/smoke가 끝나기 전에 어떤
    # @Scheduled worker도 시작하지 않게 한다. 검증 뒤 명시적 재시작에서만 true로 전환한다.
    enabled: ${SCHEDULE_PUSH_ENABLED:false}

# Ephemeral provider scenario runner는 운영에서 환경 변수로도 열리지 않게 고정한다.
# 인증된 공개 test-send API는 이 설정과 무관하게 durable outbox만 사용한다.
notification:
  push-scenario:
    enabled: false

# 외부 경로 공급자는 키를 명시한 운영 환경에서만 활성화한다.
# 키가 없는 배포도 앱 전체를 중단하지 않고, 경로 요청에서 공급자 미설정으로 응답한다.
routing:
  tmap:
    enabled: ${TMAP_ENABLED:false}
firebase:
  enabled: ${FIREBASE_ENABLED:true}
