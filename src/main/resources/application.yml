spring:
  application:
    name: noLate

  task:
    scheduling:
      # 기능별 worker flag와 분리된 Spring scheduling infrastructure 스위치다.
      enabled: ${SPRING_TASK_SCHEDULING_ENABLED:true}

    # 공용 로컬값 다음에 프로젝트 루트의 Git 제외 파일을 읽는다.
    # Docker/운영 환경은 마운트된 /config/env.properties가 마지막에 같은 키를 덮어쓴다.
    # 비밀 파일을 resources 밖에 두어 로컬 빌드 산출물에도 인증키가 포함되지 않게 한다.

  sql:
    init:
      mode: always

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MY_SQL_END_POINT}:${MY_SQL_PORT:3306}/${MY_SQL_DB_NAME}?serverTimezone=Asia/Seoul
    #useSSL=false&serverTimezone=Asia/Seoul
    username: ${MY_SQL_DB_USERNAME}
    password: ${MY_SQL_DB_PASSWORD}

  jpa:
    # SQL은 P6Spy listener 한 곳에서 출력해 원문과 bind 로그가 분리되지 않게 한다.
    # 운영 prod 프로필에서는 같은 listener가 값 없는 메타데이터만 기록한다.
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false
        default_batch_fetch_size: 1000
        jdbc:
          time_zone: Asia/Seoul
        hbm2ddl:
          halt_on_error: false
    hibernate:
      ddl-auto: update
    open-in-view: true
  jooq:
    sql-dialect: mysql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:300ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:500ms}
      repositories:
        enabled: false
  mail:
    host: ${ACCOUNT_DELETION_SMTP_HOST:}
    port: ${ACCOUNT_DELETION_SMTP_PORT:587}
    username: ${ACCOUNT_DELETION_SMTP_USERNAME:}
    password: ${ACCOUNT_DELETION_SMTP_PASSWORD:}
    # In production this must be true when the email verifier is enabled, making SMTP readiness
    # part of startup instead of failing only after a user submits a destructive request.
    test-connection: ${ACCOUNT_DELETION_SMTP_TEST_CONNECTION:false}
    properties:
      mail:
        smtp:
          auth: ${ACCOUNT_DELETION_SMTP_AUTH:true}
          starttls:
            enable: ${ACCOUNT_DELETION_SMTP_STARTTLS_ENABLE:true}
            required: ${ACCOUNT_DELETION_SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: ${ACCOUNT_DELETION_SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${ACCOUNT_DELETION_SMTP_READ_TIMEOUT_MS:5000}
          writetimeout: ${ACCOUNT_DELETION_SMTP_WRITE_TIMEOUT_MS:5000}


logging:
  level:
    # Hibernate의 SQL/bind 분리 출력을 끄고 P6Spy의 바인딩 완료 SQL 한 건만 사용한다.
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    # IDE 의존성 동기화 전에 P6Spy가 아직 없다면 Hibernate 오류 로그가 fallback이 된다.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: error
    com.noLate.global.logging.P6SpySqlErrorEventListener: info
    p6spy: "OFF"

management:
  health:
    mail:
      # 계정 삭제 메일 기능을 사용하지 않는 일반 환경에서는 SMTP 접속 점검도 수행하지 않는다.
      # SMTP 운영 감시가 필요한 환경만 명시적으로 true를 설정한다.
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      # SecurityConfig resolves endpoint identities, so custom base/path mappings and a separate
      # management port cannot turn an authenticated member route into an actuator route.
      exposure:
        # Actuator health is also rejected by a code-level WebEndpoint filter. NoLate's public,
        # opaque /health* controller is the only HTTP health contract.
        include: prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

observability:
  prometheus:
    # Exact "true" is required. Missing, false, and malformed values all keep the scrape path closed.
    public-enabled: ${OBSERVABILITY_PROMETHEUS_PUBLIC_ENABLED:}
  snapshot:
    # 30초 간격 운영 지표 조회는 로컬 SQL 디버깅을 방해하므로 prod에서만 기본 활성화한다.
    enabled: ${OBSERVABILITY_SNAPSHOT_ENABLED:false}
    fixed-delay-ms: ${OBSERVABILITY_SNAPSHOT_FIXED_DELAY_MS:30000}
    initial-delay-ms: ${OBSERVABILITY_SNAPSHOT_INITIAL_DELAY_MS:30000}
    shutdown-wait-ms: ${OBSERVABILITY_SNAPSHOT_SHUTDOWN_WAIT_MS:5000}
    # 실수신률은 최근 provider 성공을 즉시 실패로 세지 않도록 10분 aging한 14일 rolling
    # cohort로 집계한다. reader는 과도한 운영 조회를 막기 위해 각각 1..90일, 1..1440분으로 제한한다.
    push-delivery-cohort-window-days: ${OBSERVABILITY_PUSH_DELIVERY_COHORT_WINDOW_DAYS:14}
    push-delivery-cohort-grace-minutes: ${OBSERVABILITY_PUSH_DELIVERY_COHORT_GRACE_MINUTES:10}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  #expiration: ${JWT_EXPIRATION}
  issuer: ${JWT_ISSUER}
  access-token-validity-in-seconds: 86400 # 1 day
  refresh-token-validity-in-seconds: 604800 # 7 days

account-deletion:
  # External deletion is fail-closed until policy, secret, and a trusted verification adapter
  # are all explicitly ready. The public explanatory page remains available while disabled.
  enabled: ${ACCOUNT_DELETION_ENABLED:false}
  retention-policy-confirmed: ${ACCOUNT_DELETION_RETENTION_POLICY_CONFIRMED:false}
  # COMMON signup에는 verified-email timestamp가 없다. 현재 mailbox control을 계정 소유권
  # 증거로 인정한다는 보안·제품·법률 승인이 끝난 운영 환경에서만 true로 설정한다.
  common-mailbox-proof-policy-approved: ${ACCOUNT_DELETION_COMMON_MAILBOX_PROOF_POLICY_APPROVED:false}
  hmac-secret: ${ACCOUNT_DELETION_HMAC_SECRET:}
  # No default: production must explicitly bind the canonical HTTPS origin.
  public-origin: ${ACCOUNT_DELETION_PUBLIC_ORIGIN:}
  app-name: ${ACCOUNT_DELETION_APP_NAME:NoLate}
  developer-name: ${ACCOUNT_DELETION_DEVELOPER_NAME:NoLate}
  # No default: the reviewed support owner/address must be explicit.
  support-email: ${ACCOUNT_DELETION_SUPPORT_EMAIL:}
  retention-summary: ${ACCOUNT_DELETION_RETENTION_SUMMARY:탈퇴한 회원 행은 참조 안정성을 위해 비식별 상태로 유지될 수 있습니다. 공유 캘린더 참여 종료 기록 등 별도 기록의 보유기간은 자동 삭제 기능을 활성화하기 전에 확정하여 고지합니다.}
  verification-code-ttl: ${ACCOUNT_DELETION_VERIFICATION_CODE_TTL:10m}
  deletion-grant-ttl: ${ACCOUNT_DELETION_GRANT_TTL:5m}
  # 개인정보처리방침의 고정 고지와 맞추기 위해 enabled startup은 정확히 30d만 허용한다.
  request-record-retention: ${ACCOUNT_DELETION_REQUEST_RECORD_RETENTION:30d}
  processing-timeout: ${ACCOUNT_DELETION_PROCESSING_TIMEOUT:1h}
  retention-cleanup-enabled: ${ACCOUNT_DELETION_RETENTION_CLEANUP_ENABLED:true}
  retention-cleanup-initial-delay: ${ACCOUNT_DELETION_RETENTION_CLEANUP_INITIAL_DELAY:1h}
  retention-cleanup-fixed-delay: ${ACCOUNT_DELETION_RETENTION_CLEANUP_FIXED_DELAY:1d}
  max-verification-attempts: ${ACCOUNT_DELETION_MAX_VERIFICATION_ATTEMPTS:5}
  identity-rate-limit: ${ACCOUNT_DELETION_IDENTITY_RATE_LIMIT:3}
  identity-rate-window: ${ACCOUNT_DELETION_IDENTITY_RATE_WINDOW:1d}
  requester-rate-limit: ${ACCOUNT_DELETION_REQUESTER_RATE_LIMIT:10}
  requester-rate-window: ${ACCOUNT_DELETION_REQUESTER_RATE_WINDOW:1h}
  verification:
    email:
      # Conditional JavaMail adapter. Disabled means the support-only public page remains active.
      enabled: ${ACCOUNT_DELETION_EMAIL_VERIFICATION_ENABLED:false}
      from: ${ACCOUNT_DELETION_EMAIL_FROM:}


server:
  port: 5522

app-links:
  apple:
    team-id: ${APP_LINKS_APPLE_TEAM_ID:457QQLB6H6}
    bundle-id: ${APP_LINKS_APPLE_BUNDLE_ID:com.anonymous.nolatefe}
  android:
    package-name: ${APP_LINKS_ANDROID_PACKAGE_NAME:com.anonymous.nolate_fe}
    # Play/App Signing의 SHA-256 지문을 쉼표로 구분한다. 빈 값은 endpoint를 fail-closed한다.
    certificate-sha256-fingerprints: ${APP_LINKS_ANDROID_CERT_SHA256_FINGERPRINTS:}

schedule:
  sharing:
    # 공유는 기본 제공 기능이다. 운영 kill switch는 exact lowercase "true"만 허용하는
    # 서버 정책을 거치므로 false/오타/공백 값은 모두 안전하게 비활성화된다.
    enabled: ${SCHEDULE_SHARING_ENABLED:true}
    moderation:
      # 일반 로그인 뒤 이 회원 ID allowlist를 한 번 더 통과해야 운영 API를 사용할 수 있다.
      # 빈 값은 fail-closed이며 모든 운영자 접근을 거부한다.
      operator-member-ids: ${SHARING_MODERATOR_MEMBER_IDS:}
    rate-limit:
      enabled: ${SHARING_RATE_LIMIT_ENABLED:true}
      direct-share-per-hour: ${SHARING_DIRECT_SHARE_RATE_LIMIT:30}
      invitation-create-per-hour: ${SHARING_INVITATION_CREATE_RATE_LIMIT:10}
  calendar-cache:
    enabled: ${SCHEDULE_CALENDAR_CACHE_ENABLED:true}
    ttl: ${SCHEDULE_CALENDAR_CACHE_TTL:15m}
  route-setup-reminder:
    enabled: ${SCHEDULE_ROUTE_SETUP_REMINDER_ENABLED:true}
    fixed-delay-ms: ${SCHEDULE_ROUTE_SETUP_REMINDER_FIXED_DELAY_MS:300000}
    batch-size: ${SCHEDULE_ROUTE_SETUP_REMINDER_BATCH_SIZE:50}
    max-attempts: ${SCHEDULE_ROUTE_SETUP_REMINDER_MAX_ATTEMPTS:3}
    retry-delay-seconds: ${SCHEDULE_ROUTE_SETUP_REMINDER_RETRY_DELAY_SECONDS:300}
  push:
    enabled: ${SCHEDULE_PUSH_ENABLED:true}
    fixed-delay-ms: ${SCHEDULE_PUSH_FIXED_DELAY_MS:60000}
    # 한 번의 claim transaction이 잠그는 due job 수를 제한해 backlog가 lease timeout으로
    # 복구되는 동안 다른 인스턴스가 다음 batch를 처리할 수 있게 한다.
    batch-size: ${SCHEDULE_PUSH_BATCH_SIZE:50}
    retry-delay-minutes: ${SCHEDULE_PUSH_RETRY_DELAY_MINUTES:1}
    # 실패 delivery가 오래된 ETA payload를 뒤늦게 발송하지 못하게 하는 안전 TTL이다.
    # 만료 event는 현재 check를 닫고 다음 scheduler tick에서 새 ETA/event로 교체한다.
    eta-event-ttl-seconds: ${SCHEDULE_PUSH_ETA_EVENT_TTL_SECONDS:120}
    # 푸시 공급자의 일시 장애가 지속될 때 무한 재시도를 막는 작업 단위 한도다.
    max-retry-count: ${SCHEDULE_PUSH_MAX_RETRY_COUNT:3}
    delivery-grace-minutes: ${SCHEDULE_PUSH_DELIVERY_GRACE_MINUTES:10}
    processing-timeout-minutes: ${SCHEDULE_PUSH_PROCESSING_TIMEOUT_MINUTES:10}
    departure-alert-lead-minutes: ${SCHEDULE_PUSH_DEPARTURE_ALERT_LEAD_MINUTES:15}
    departure-reminder-interval-minutes: ${SCHEDULE_PUSH_DEPARTURE_REMINDER_INTERVAL_MINUTES:5}
    departure-snooze-minutes: ${SCHEDULE_PUSH_DEPARTURE_SNOOZE_MINUTES:5}
    # ETA worker와 별개로 이미 예약된 native alarm tombstone을 정리한다.
    departure-alarm-expiry-enabled: ${SCHEDULE_DEPARTURE_ALARM_EXPIRY_ENABLED:true}
  traffic:
    # provider 오응답이 과도하게 이른 출발 알림으로 승격되지 않도록 하는 제품 상한이다.
    max-travel-minutes: ${SCHEDULE_TRAFFIC_MAX_TRAVEL_MINUTES:1440}
    # fallback 사이에도 유지하는 마지막 live 비교 기준의 최대 신선도다.
    live-comparator-max-age-minutes: ${SCHEDULE_TRAFFIC_LIVE_COMPARATOR_MAX_AGE_MINUTES:60}
    accuracy:
      # 출발 snapshot의 provider 계산이 이 시간보다 오래되면 진단용으로만 저장한다.
      max-prediction-age-minutes: ${SCHEDULE_ETA_ACCURACY_MAX_PREDICTION_AGE_MINUTES:60}
      # 절대 도착시각은 추천 출발시각과 실제 출발의 차이가 이 범위 안인 표본만 집계한다.
      max-provider-departure-offset-minutes: ${SCHEDULE_ETA_ACCURACY_MAX_DEPARTURE_OFFSET_MINUTES:15}
      # client 도착 callback은 느린 전송을 허용하되 지나치게 오래된 값은 거부한다.
      max-arrival-report-delay-minutes: ${SCHEDULE_ETA_ACCURACY_MAX_REPORT_DELAY_MINUTES:1440}
      max-arrival-future-skew-seconds: ${SCHEDULE_ETA_ACCURACY_MAX_FUTURE_SKEW_SECONDS:60}
      # 시간 오차가 이 값을 넘는 실제 도착 관측은 보존하되 정확도 집계에서는 제외한다.
      max-observation-precision-seconds: ${SCHEDULE_ETA_ACCURACY_MAX_OBSERVATION_PRECISION_SECONDS:120}
      # USER_ADJUSTED의 분 단위 역보정 상한이다. DB 절대 상한은 60분이다.
      max-arrival-adjustment-minutes: ${SCHEDULE_ETA_ACCURACY_MAX_ARRIVAL_ADJUSTMENT_MINUTES:60}
      # 출발 이후 도착 자체의 물리적 상한과, 예측 대비 비정상 지연의 집계 상한이다.
      max-arrival-after-departure-minutes: ${SCHEDULE_ETA_ACCURACY_MAX_ARRIVAL_AFTER_DEPARTURE_MINUTES:1440}
      max-eligible-delay-vs-prediction-minutes: ${SCHEDULE_ETA_ACCURACY_MAX_ELIGIBLE_DELAY_MINUTES:360}
      # unversioned 기본값은 future verified 관측도 정확도 cohort에서 fail-closed한다.
      backend-cohort-version: ${SCHEDULE_ETA_ACCURACY_BACKEND_COHORT_VERSION:unversioned}
    tmap:
      enabled: ${TMAP_ENABLED:false}
      app-key: ${TMAP_APP_KEY:}
      base-url: ${TMAP_BASE_URL:https://apis.openapi.sk.com}
  ai:
    # 규칙 파서가 필수 값을 찾지 못했을 때만 사용하는 선택적 AI 보완 설정이다.
    groq:
      enabled: ${GROQ_ENABLED:false}
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:openai/gpt-oss-20b}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      # 분당 토큰 제한(429)은 공급자가 안내한 대기 시간 뒤 한 번만 재시도한다.
      max-attempts: ${GROQ_MAX_ATTEMPTS:2}
      max-backoff-ms: ${GROQ_MAX_BACKOFF_MS:12000}

routing:
  tmap:
    enabled: ${TMAP_ENABLED:false}
    app-key: ${TMAP_APP_KEY:}
    base-url: ${TMAP_BASE_URL:https://apis.openapi.sk.com}

eta:
  resilience:
    # 대중교통 전체 계산의 soft quality boundary다. ODsay connect+read hard timeout 합(6초)
    # 보다 길고 worker lease보다 짧아야 하며, 늦게 끝난 결과는 저장 ETA fallback으로 폐기한다.
    calculation-soft-deadline: ${ETA_CALCULATION_SOFT_DEADLINE:8s}
    provider-default:
      # 런타임 검증 상한: concurrent 64, queued 256, wait 5초, failures 100, open 10분.
      max-concurrent-calls: ${ETA_PROVIDER_DEFAULT_MAX_CONCURRENT_CALLS:8}
      max-queued-calls: ${ETA_PROVIDER_DEFAULT_MAX_QUEUED_CALLS:16}
      max-queue-wait: ${ETA_PROVIDER_DEFAULT_MAX_QUEUE_WAIT:100ms}
      failure-threshold: ${ETA_PROVIDER_DEFAULT_FAILURE_THRESHOLD:5}
      open-duration: ${ETA_PROVIDER_DEFAULT_OPEN_DURATION:30s}
    providers:
      odsay:
        # 경로 재조회는 한 ETA 계산 안에서도 최대 3회 발생하므로 별도 quota/bulkhead를 둔다.
        max-concurrent-calls: ${ODSAY_ETA_MAX_CONCURRENT_CALLS:4}
        max-queued-calls: ${ODSAY_ETA_MAX_QUEUED_CALLS:8}
        max-queue-wait: ${ODSAY_ETA_MAX_QUEUE_WAIT:100ms}
        failure-threshold: ${ODSAY_ETA_FAILURE_THRESHOLD:5}
        open-duration: ${ODSAY_ETA_OPEN_DURATION:30s}
      seoul_subway:
        max-concurrent-calls: ${SEOUL_SUBWAY_ETA_MAX_CONCURRENT_CALLS:4}
        max-queued-calls: ${SEOUL_SUBWAY_ETA_MAX_QUEUED_CALLS:8}
        max-queue-wait: ${SEOUL_SUBWAY_ETA_MAX_QUEUE_WAIT:100ms}
        failure-threshold: ${SEOUL_SUBWAY_ETA_FAILURE_THRESHOLD:5}
        open-duration: ${SEOUL_SUBWAY_ETA_OPEN_DURATION:30s}
      seoul_bus:
        max-concurrent-calls: ${SEOUL_BUS_ETA_MAX_CONCURRENT_CALLS:4}
        max-queued-calls: ${SEOUL_BUS_ETA_MAX_QUEUED_CALLS:8}
        max-queue-wait: ${SEOUL_BUS_ETA_MAX_QUEUE_WAIT:100ms}
        failure-threshold: ${SEOUL_BUS_ETA_FAILURE_THRESHOLD:5}
        open-duration: ${SEOUL_BUS_ETA_OPEN_DURATION:30s}
      tago_bus:
        max-concurrent-calls: ${TAGO_BUS_ETA_MAX_CONCURRENT_CALLS:4}
        max-queued-calls: ${TAGO_BUS_ETA_MAX_QUEUED_CALLS:8}
        max-queue-wait: ${TAGO_BUS_ETA_MAX_QUEUE_WAIT:100ms}
        failure-threshold: ${TAGO_BUS_ETA_FAILURE_THRESHOLD:5}
        open-duration: ${TAGO_BUS_ETA_OPEN_DURATION:30s}
  transit:
    # 정류장에 도착하자마자 떠나는 차량을 잡을 수 있다고 계산하지 않도록 하는 승차 여유다.
    boarding-buffer-seconds: ${SCHEDULE_TRANSIT_BOARDING_BUFFER_SECONDS:60}
    # 물리적으로 놓친 환승을 판정하는 명시적 운영 버퍼다.
    transfer-buffer-seconds: ${SCHEDULE_TRANSIT_TRANSFER_BUFFER_SECONDS:0}
    # ODsay 분 단위 시간표의 exact/sub-minute 경계를 정시 가능으로 과신하지 않는다. 이 여유가
    # 부족하면 MISSED로 단정하지 않고 UNKNOWN으로 내려 더 이른 동일 경로를 제한 재탐색한다.
    transfer-confidence-margin-seconds: ${SCHEDULE_TRANSIT_TRANSFER_CONFIDENCE_MARGIN_SECONDS:60}
    # 첫 차량을 놓치는 경우 다음 도착 차량까지 선택할 수 있도록 provider 허용 상한까지 조회한다.
    arrival-limit: ${SCHEDULE_TRANSIT_ARRIVAL_LIMIT:10}
    # provider 원천 갱신시각이 오래된 도착정보를 미래 차량처럼 사용하지 않는다.
    arrival-source-max-age-seconds: ${SCHEDULE_TRANSIT_ARRIVAL_SOURCE_MAX_AGE_SECONDS:120}
    # 한 계산 안의 safe-departure 반복이 같은 first-stop provider를 중복 호출하지 않게 한다.
    arrival-cache-ttl-seconds: ${SCHEDULE_TRANSIT_ARRIVAL_CACHE_TTL_SECONDS:15}
    arrival-cache-max-entries: ${SCHEDULE_TRANSIT_ARRIVAL_CACHE_MAX_ENTRIES:512}
    safe-departure:
      # depart-at 공급자의 시간표 불연속을 다시 확인하되 worker 외부 호출 횟수를 제한한다.
      max-searches: ${SCHEDULE_TRANSIT_SAFE_DEPARTURE_MAX_SEARCHES:3}
      tolerance-seconds: ${SCHEDULE_TRANSIT_SAFE_DEPARTURE_TOLERANCE_SECONDS:60}
    odsay:
      # 모바일 공개 키와 분리된 서버용 키가 준비된 환경에서만 활성화한다.
      enabled: ${ODSAY_ENABLED:false}
      api-key: ${ODSAY_SERVER_API_KEY:}
      base-url: ${ODSAY_BASE_URL:https://api.odsay.com/v1/api}
      allow-insecure-http: ${ODSAY_ALLOW_INSECURE_HTTP:false}
      # 공식 host/loopback 이외의 egress proxy는 보안 검토 뒤 두 opt-in을 각각 명시한다.
      allow-custom-endpoint: ${ODSAY_ALLOW_CUSTOM_ENDPOINT:false}

calendar:
  metadata-cache:
    enabled: ${CALENDAR_METADATA_CACHE_ENABLED:true}
    # DB의 KASI freshness(기본 7일)를 최대 하루 이상 늦추지 않는다.
    ttl: ${CALENDAR_METADATA_CACHE_TTL:24h}
  kasi:
    enabled: ${KASI_ENABLED:true}
    # 특일 정보와 음양력 정보가 같은 공공데이터포털 인증키를 사용한다.
    # 실제 키는 저장소 밖의 env.local.properties 또는 운영 환경변수에만 둔다.
    service-key: ${KASI_API_KEY:}
    base-url: ${KASI_BASE_URL:https://apis.data.go.kr/B090041/openapi/service}
    cache-ttl-hours: ${KASI_CACHE_TTL_HOURS:168}

transit:
  # 한 logical 조회가 여러 station/arrival HTTP 요청으로 증폭될 때 replica 내부 burst를
  # fail-fast로 제한한다. 계정 전체 다중 replica quota는 운영의 외부 shared budget으로 둔다.
  wire-rate-limit:
    seoul-subway-per-second: ${SEOUL_SUBWAY_WIRE_CALLS_PER_SECOND:10}
    seoul-bus-per-second: ${SEOUL_BUS_WIRE_CALLS_PER_SECOND:20}
    tago-bus-per-second: ${TAGO_BUS_WIRE_CALLS_PER_SECOND:20}
  seoul:
    api-key: ${SEOUL_OPENAPI_KEY:}
    subway-api-key: ${SEOUL_SUBWAY_API_KEY:}
    bus-api-key: ${SEOUL_BUS_API_KEY:}
    subway-base-url: ${SEOUL_SUBWAY_BASE_URL:http://swopenAPI.seoul.go.kr/api/subway}
    bus-base-url: ${SEOUL_BUS_BASE_URL:http://ws.bus.go.kr/api/rest}
    # 서울 공식 endpoint가 HTTP인 환경은 key/ETA 무결성 위험을 검토한 뒤에만 명시적으로 연다.
    allow-insecure-http: ${SEOUL_ALLOW_INSECURE_HTTP:false}
  tago:
    api-key: ${TAGO_API_KEY:}
    bus-api-key: ${TAGO_BUS_API_KEY:${TAGO_API_KEY:}}
    base-url: ${TAGO_BASE_URL:https://apis.data.go.kr/1613000}
    city-codes: ${TAGO_BUS_CITY_CODES:}
    allow-insecure-http: ${TAGO_ALLOW_INSECURE_HTTP:false}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  project-id: ${FIREBASE_PROJECT_ID:}
  # strict invariant:
  # connect+read+write < provider-max-call < dispatch-lease,
  # firebase-admin 9.8.0 worst case ((connect+read+write)*5 + 60s*4) < dispatch-lease,
  # dispatch-lease-wait > provider-max-call. 등호나 0/음수는 startup에서 거절한다.
  connect-timeout-millis: ${FIREBASE_CONNECT_TIMEOUT_MILLIS:5000}
  read-timeout-millis: ${FIREBASE_READ_TIMEOUT_MILLIS:30000}
  write-timeout-millis: ${FIREBASE_WRITE_TIMEOUT_MILLIS:5000}

notification:
  push-token:
    provider-max-call-seconds: ${NOTIFICATION_PUSH_PROVIDER_MAX_CALL_SECONDS:60}
    dispatch-lease-seconds: ${NOTIFICATION_PUSH_TOKEN_DISPATCH_LEASE_SECONDS:600}
    dispatch-lease-wait-millis: ${NOTIFICATION_PUSH_TOKEN_DISPATCH_LEASE_WAIT_MILLIS:70000}
    dispatch-lease-poll-millis: ${NOTIFICATION_PUSH_TOKEN_DISPATCH_LEASE_POLL_MILLIS:25}
    retirement-reaper-enabled: ${NOTIFICATION_PUSH_TOKEN_RETIREMENT_REAPER_ENABLED:true}
    retirement-reaper-fixed-delay-millis: ${NOTIFICATION_PUSH_TOKEN_RETIREMENT_REAPER_FIXED_DELAY_MILLIS:30000}
  push-outbox:
    enabled: ${NOTIFICATION_PUSH_OUTBOX_ENABLED:true}
    fixed-delay-ms: ${NOTIFICATION_PUSH_OUTBOX_FIXED_DELAY_MS:30000}
    # provider 호출 직전에 한 건씩 claim하며 한 run의 최대 처리량만 제한한다.
    batch-size: ${NOTIFICATION_PUSH_OUTBOX_BATCH_SIZE:50}
    max-attempts: ${NOTIFICATION_PUSH_OUTBOX_MAX_ATTEMPTS:5}
    retry-delay-seconds: ${NOTIFICATION_PUSH_OUTBOX_RETRY_DELAY_SECONDS:60}
    processing-timeout-seconds: ${NOTIFICATION_PUSH_OUTBOX_PROCESSING_TIMEOUT_SECONDS:600}

auth:
  social:
    kakao:
      app-id: ${SNS_KAKAO_APP_ID:}
    apple:
      audiences: ${SNS_APPLE_AUDIENCES:}
      token-lifecycle:
        enabled: ${APPLE_TOKEN_LIFECYCLE_ENABLED:false}
        client-id: ${APPLE_TOKEN_CLIENT_ID:}
        team-id: ${APPLE_TOKEN_TEAM_ID:}
        key-id: ${APPLE_TOKEN_KEY_ID:}
        private-key: ${APPLE_TOKEN_PRIVATE_KEY:}
        redirect-uri: ${APPLE_TOKEN_REDIRECT_URI:}
        base-url: ${APPLE_TOKEN_BASE_URL:https://appleid.apple.com}
        client-secret-validity-seconds: ${APPLE_TOKEN_CLIENT_SECRET_VALIDITY_SECONDS:300}
        encryption:
          current-key-id: ${APPLE_TOKEN_ENCRYPTION_KEY_ID:}
          current-key: ${APPLE_TOKEN_ENCRYPTION_KEY:}
          previous-keys: ${APPLE_TOKEN_PREVIOUS_ENCRYPTION_KEYS:}
        capture:
          # Apple success 뒤 회원 transaction이 실패/종료될 때 revoke 보상으로 넘기는 상한.
          binding-deadline-seconds: ${APPLE_TOKEN_CAPTURE_BINDING_DEADLINE_SECONDS:120}
        revocation:
          worker-enabled: ${APPLE_TOKEN_REVOCATION_WORKER_ENABLED:true}
          fixed-delay-ms: ${APPLE_TOKEN_REVOCATION_FIXED_DELAY_MS:30000}
          batch-size: ${APPLE_TOKEN_REVOCATION_BATCH_SIZE:20}
          max-attempts: ${APPLE_TOKEN_REVOCATION_MAX_ATTEMPTS:12}
          retry-delay-seconds: ${APPLE_TOKEN_REVOCATION_RETRY_DELAY_SECONDS:60}
          max-retry-delay-seconds: ${APPLE_TOKEN_REVOCATION_MAX_RETRY_DELAY_SECONDS:21600}
          processing-timeout-seconds: ${APPLE_TOKEN_REVOCATION_PROCESSING_TIMEOUT_SECONDS:120}

---
# 테스트 profile에서는 저장소/로컬/운영 비밀 파일 자체를 import하지 않는다.
spring:
  config:
    activate:
      on-profile: "!test"
    import:
      - optional:file:./env.local.properties
      - optional:file:/config/env.properties
