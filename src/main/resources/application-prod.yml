spring:
  datasource:
    hikari:
      # 가정용 서버에서 요청 스레드가 DB connection을 무제한으로 기다리지 않게 한다.
      # Hikari의 connection-timeout 단위는 ms이며 최소 허용값(250ms)보다 여유 있게 둔다.
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:8}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:3000}
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      # 운영 DDL은 maintenance window의 검토된 SQL만 수행한다. update를 허용하면
      # old/new writer 사이에서 nullable/index 변경 순서가 뒤섞일 수 있다.
      ddl-auto: validate
    open-in-view: false

server:
  tomcat:
    # Boot/Tomcat 기본값(threads 200, connections 8192)은 홈서버의 CPU/DB보다 크다.
    # 작은 실행 상한과 유한 대기열로 순간 부하가 JVM 전체로 확산되는 것을 막는다.
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:32}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:4}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:32}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:128}

logging:
  level:
    # JDBC driver duplicate-key 원문은 opaque credential을 포함할 수 있다. 운영에서는
    # P6Spy의 operation/table/SQLState/vendorCode/exceptionClass 기반 metadata만 남기며
    # SQL 원문, sqlWithValues, SQLException message/stack trace는 기록하지 않는다.
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
    com.noLate.global.logging.P6SpySqlErrorEventListener: info
    # 요청마다 발생하는 HIT/MISS/STORE INFO는 운영 디스크 I/O만 늘린다.
    # 클래스의 WARN fallback/역직렬화/Redis 실패 로그는 그대로 보존한다.
    com.noLate.schedule.application.cache.ScheduleCalendarCacheService: warn

observability:
  snapshot:
    # 운영 지표 스냅샷은 환경 변수가 없을 때도 유지한다.
    enabled: ${OBSERVABILITY_SNAPSHOT_ENABLED:true}

# 운영 API 계약과 내부 모델을 공개하지 않는다. 개발/테스트 프로필의 Swagger는 유지한다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

schedule:
  sharing:
    # Store production에서도 공유를 제공한다. 긴급 차단은 환경값을 exact false로 전환하며,
    # malformed 값은 중앙 정책에서 fail closed 된다.
    enabled: ${SCHEDULE_SHARING_ENABLED:true}
  push:
    # 최초 migration 기동에서는 ETA job claim만 멈춘다. Durable outbox와 보존/토큰/알람
    # cleanup worker는 각자의 enable flag로 계속 동작한다.
    enabled: ${SCHEDULE_PUSH_ENABLED:false}

# Ephemeral provider scenario runner는 운영에서 환경 변수로도 열리지 않게 고정한다.
# 인증된 공개 test-send API는 이 설정과 무관하게 durable outbox만 사용한다.
notification:
  push-scenario:
    enabled: false
  push-schedule-scenario:
    enabled: false

# 외부 경로 공급자는 키를 명시한 운영 환경에서만 활성화한다.
# 키가 없는 배포도 앱 전체를 중단하지 않고, 경로 요청에서 공급자 미설정으로 응답한다.
routing:
  tmap:
    enabled: ${TMAP_ENABLED:false}
firebase:
  enabled: ${FIREBASE_ENABLED:true}

auth:
  social:
    apple:
      # Store builds that offer Apple account creation must never run without the
      # server-side exchange, encrypted credential store, and durable revoke worker.
      token-lifecycle:
        enabled: true
        revocation:
          worker-enabled: true
